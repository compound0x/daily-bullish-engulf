name: Strict Bullish Engulfing Scanner

on:
  workflow_dispatch:
  schedule:
    # 21:10 UTC = 17:10 ET during US daylight saving time.
    # The scanner itself selects the latest completed US session, so manual runs
    # on weekends/holidays still evaluate the most recent completed trading day.
    - cron: '10 21 * * 1-5'

permissions:
  contents: write

jobs:
  build-strict-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strict scanner
        run: python strict_bullish_engulf_scanner.py

      - name: Deploy strict scanner to GitHub Pages subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: strict-bullish-engulf-report
          destination_dir: strict-bullish-engulf
          keep_files: true
